<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Submit Your Own Recipes!</title>
    </head>
    <body>
        <h1>SUBMIT YOUR OWN RECIPES!</h1>
        <form action="index.html">
            <p>Recipe Name:
                <input type="text" name="recipe name" size="15" />
            </p>

            <p>Please List ALL Ingredients And Instructions For This Dish:</p>
            <textarea name="ingredients and instructions">Enter ingredients and instructions here...</textarea>

            <p>Please Select Difficulty of Recipe:
                <br />
                <input type="radio" name="Difficulty" value="Easy"> Easy
                <input type="radio" name="Difficulty" value="Medium"> Medium
                <input type="radio" name="Difficulty" value="Hard"> Hard
            </p>

            <p>Please list any dietary restrictions:
                <br />
                <input type="checkbox" name="diet" value="vegetarian"> Vegetarian
                <input type="checkbox" name="diet" value="vegan"> Vegan
                <input type="checkbox" name="diet" value="lactose intolerant"> Lactose Intolerant
            </p>

            <input type="submit" name="recipe submit" value="Submit">
        </form>
    </body>
</html>
