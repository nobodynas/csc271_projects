<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Star Wars: Revenge of the Sith - Movie Details</title>
        <link rel="stylesheet" href="css/style.css">

        <!-- Inline CSS for custom styling of the movie image -->
        <style>
            .movie-image {
                width: 150px;
            }
        </style>

    </head>

    <body>
        <!-- Header section of the webpage -->
        <header>
            <div class="logo">
                <a href="index.html"><img src="img/logo.png" alt="URI-MDB Logo"></a>
            </div>
            <!-- Main page title -->
            <h1>Star Wars: Revenge of the Sith</h1>
        </header>
        
        <main>
            <!-- Container with detailed information about your favorite movie. 
                DON'T MAKE ANY CHANGES TO THIS HTML! You will add content dynamically using JS! 
            -->
            <div class="movie-info">
                <img class="movie-image" src="img/placeholder.png" alt="Movie Thumbnail">
                <h2 class="movie-name">Movie Name</h2>
                <div class="rating" data-rating="0"></div>
                <p class="description">Movie description...</p>
            </div>

            <br />
            <hr />

            <!-- User Reviews section -->
            <section class="reviews">

                <!-- Header for the reviews section with a rating filter dropdown -->
                <div class="reviews-header">
                    <h3>User Reviews</h3>
                    <div class="filter">

                        <!-- Filter label and dropdown to filter reviews by rating -->
                        <label for="rating-filter">Filter by rating:</label>
                        <select id="rating-filter">
                            <!-- Filter options for each rating level and 'All' option -->
                            <option value="All">All</option>
                            <option value="5">5 Stars</option>
                            <option value="4">4 Stars</option>
                            <option value="3">3 Stars</option>
                            <option value="2">2 Stars</option>
                            <option value="1">1 Star</option>
                        </select>
                    </div>
                </div>

                <!-- Review card with placeholders for each review's details -->
                <div class="review-card">
                    <div class="review-rating" data-rating="0"></div>
                    <p class="review-username">Username <span class="review-date">Date</span></p>
                    <p class="review-text">Review...</p>
                </div>

               <!-- Review card with placeholders for each review's details -->
               <div class="review-card">
                    <div class="review-rating" data-rating="0"></div>
                    <p class="review-username">Username <span class="review-date">Date</span></p>
                    <p class="review-text">Review...</p>
                </div>

                <!-- Review card with placeholders for each review's details -->
                <div class="review-card">
                    <div class="review-rating" data-rating="0"></div>
                    <p class="review-username">Username <span class="review-date">Date</span></p>
                    <p class="review-text">Review...</p>
                </div>
                
            </section>
        </main>
            <script>
            
            var myMovieInfo = [
                "Star Wars: Revenge of the Sith",
                "https://upload.wikimedia.org/wikipedia/en/9/93/Star_Wars_Episode_III_Revenge_of_the_Sith_poster.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail_unscaled&_=20171214071623",
                4.998,
                "Anakin Skywalker turns to the dark side and becomes Darth Vader"
            ];

            var movieImage = document.querySelector('img.movie-image');
            movieImage.src = myMovieInfo[1];
            movieImage.alt = myMovieInfo[0];

            var movieName = document.querySelector('h2.movie-name');
            movieName.innerHTML = '<h2 class="movie-name">' + myMovieInfo[0] +'</h2>';

            var movieDesc = document.querySelector('p.description');
            movieDesc.innerHTML = '<p class="description">' + myMovieInfo[3] + '</p>';

            var filled = "★";
		    var empty = "☆";
		    var ratingString = "";
            for (var j = 0; j < 5; j++) {
                if (j < myMovieInfo[2]) {
                    ratingString += filled;
                }
                else {
                    ratingString += empty;
                }
		    }

            var movieRating = document.querySelector('div.rating');
		    movieRating.innerHTML = '<div class="rating" data-rating="0">' + ratingString + '</div>';
        </script> 
        <script src="js/movie-info.js"></script> 
        <script src="js/reviews.js"></script> 
    </body>
</html>
